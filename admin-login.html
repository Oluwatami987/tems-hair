<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in · Tems Hair</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head><body class="login"><div class="lwrap"><a href="index.html"><img class="lg" src="assets/logo-ivory.png" alt="Tems Hair"></a><div class="eyebrow">Secure admin</div><h1>Welcome back, Tems</h1><p>Enter your admin PIN to manage the shared store catalog.</p><form id="login-form"><label for="pin" class="sr-only">Admin PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" minlength="6" maxlength="12" required placeholder="Enter PIN" style="width:100%;padding:15px;border-radius:12px;border:1px solid #d8c9c3;font:600 18px Montserrat,sans-serif;letter-spacing:.3em;text-align:center"><button class="btn btn-wine" type="submit" style="width:100%;margin-top:14px">Sign in</button><p id="login-status" role="status" aria-live="polite"></p></form><div class="secure">Protected admin access · Sign-in expires after 8 hours</div></div><script>
document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const status=document.querySelector('#login-status');const button=event.currentTarget.querySelector('button');button.disabled=true;status.textContent='Signing in…';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.querySelector('#pin').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Sign-in failed');location.replace('admin-products.html')}catch(error){status.textContent=error.message}finally{button.disabled=false}});
</script></body></html>
